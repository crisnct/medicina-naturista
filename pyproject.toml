[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "medicina-naturista"
version = "0.1.0"
description = "Interfata web cu recuperare locala pentru documente de medicina naturista."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "fastembed>=0.8,<1",
    "httpx>=0.28,<1",
    "numpy>=2.4,<3",
    "pgvector>=0.3,<1",
    "pydantic>=2.10,<3",
    "pyahocorasick>=2.3.1,<3",
    "psycopg[binary]>=3,<4",
    "psycopg-pool>=3,<4",
    "pypdf>=6,<7",
    "python-dotenv>=1,<2",
    "reportlab>=4.4,<5",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["testcontainers[postgres]>=4,<5", "ruff>=0.17,<1", "mypy>=2.4,<3", "pip-tools==7.6.2", "pytest>=9,<10"]
pdf = ["PyMuPDF>=1.26,<2", "Pillow>=10.4,<13"]

[project.scripts]
medical-search = "backend.ai.search:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend*", "scripts*"]

[tool.setuptools.package-data]
scripts = ["dictionaires/ro/*.dic", "dictionaires/ro/*.aff"]
backend = [
    "migrations/*.sql",
    "ai/prompts/*.md",
    "ai/resources/*.txt",
    "reporting/assets/*.png",
    "web/static/images/*.svg",
    "web/static/images/*.webp",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/scripts/icd10_work", "src/scripts/dictionaires"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/tests/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/backend/config.py", "src/backend/core/contracts.py", "src/backend/core/operation_context.py", "src/backend/core/conversation.py", "src/backend/core/models.py", "src/backend/web/dependencies.py", "src/backend/ai/content_evaluation.py"]
follow_imports = "silent"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["backend.core.contracts", "backend.core.operation_context", "backend.ai.content_evaluation"]
disallow_untyped_defs = true
disallow_any_generics = true
