[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "medicina-naturista"
version = "0.1.0"
description = "Interfata web cu recuperare locala pentru documente de medicina naturista."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "fastembed>=0.8,<1",
    "gradio>=6,<7",
    "httpx>=0.28,<1",
    "numpy>=2.4,<3",
    "pypdf>=6,<7",
    "python-dotenv>=1,<2",
    "reportlab>=4.4,<5",
    "uvicorn>=0.35,<1",
]

[project.scripts]
medical-search = "medicina_naturista.ai.search:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medicina_naturista = [
    "ai/prompts/*.md",
    "ai/resources/*.txt",
    "reporting/assets/*.png",
    "web/static/css/*.css",
    "web/static/js/*.js",
    "web/static/images/*.svg",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
