services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    container_name: medicina-db
    # The chunks table (~150 MB) must fit in shared_buffers (default 128 MB), or
    # the first search after a restart reads it from disk and takes ~0.5 s.
    command: ["postgres", "-c", "shared_buffers=512MB"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medicina}
      POSTGRES_USER: ${POSTGRES_USER:-medicina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medicina} -d ${POSTGRES_DB:-medicina}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    networks: [internal]
  app:
    build:
      context: .
      args:
        PUBLIC_BASE_PATH: ${PUBLIC_ROOT_PATH:-/medicina}
    restart: unless-stopped
    container_name: medicina
    stop_grace_period: 30s
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 4g
    depends_on:
      db:
        condition: service_healthy
    environment:
      X_API_KEY: ${X_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      XAI_API_BASE: ${XAI_API_BASE:-https://api.x.ai/v1}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_API_BASE: ${HF_API_BASE:-https://router.huggingface.co/v1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434/v1}
      VLLM_API_BASE: ${VLLM_API_BASE:-http://vllm-report:8000/v1}
      OLLAMA_KEEP_ALIVE_SECONDS: ${OLLAMA_KEEP_ALIVE_SECONDS:-60}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MAX_OUTPUT_TOKENS_BY_MODEL: ${OLLAMA_MAX_OUTPUT_TOKENS_BY_MODEL:-}
      MEDICAL_CONDITION_AI_LOCAL_MODEL: ${MEDICAL_CONDITION_AI_LOCAL_MODEL:-gemma3:1b}
      REPORT_GENERATION_MODELS: ${REPORT_GENERATION_MODELS:-ollama-gemma3:1b,ollama-gemma4:12b,ollama-ministral-3:8b,ollama-qwen3.5:9b,ollama-qwen3.5:4b,ollama-deepseek-r1:8b,deepseek-flash,huggingface-deepseek-v4-flash,grok-4.3}
      REPORT_GENERATION_BATCH_MAX_TOKENS_BY_MODEL: ${REPORT_GENERATION_BATCH_MAX_TOKENS_BY_MODEL:-}
      REPORT_BATCH_WORKERS: ${REPORT_BATCH_WORKERS:-2}
      CONDITION_AI_LOCAL_BASE: ${CONDITION_AI_LOCAL_BASE:-http://host.docker.internal:11434/v1}
      CONDITION_AI_TIMEOUT_SECONDS: ${CONDITION_AI_TIMEOUT_SECONDS:-10}
      CONDITION_AI_MAX_OUTPUT_TOKENS: ${CONDITION_AI_MAX_OUTPUT_TOKENS:-300}
      MESSAGE_CLASSIFICATION_TIMEOUT_SECONDS: ${MESSAGE_CLASSIFICATION_TIMEOUT_SECONDS:-10}
      MESSAGE_CLASSIFICATION_MAX_OUTPUT_TOKENS: ${MESSAGE_CLASSIFICATION_MAX_OUTPUT_TOKENS:-300}
      HERB_ASSOCIATION_AI_BASE: ${HERB_ASSOCIATION_AI_BASE:-http://host.docker.internal:11434/v1}
      HERB_ASSOCIATION_AI_MODEL: ${HERB_ASSOCIATION_AI_MODEL:-qwen3.5:9b}
      HERB_ASSOCIATION_AI_MAX_UNITS: ${HERB_ASSOCIATION_AI_MAX_UNITS:-6}
      HERB_ASSOCIATION_AI_MAX_PAIRS: ${HERB_ASSOCIATION_AI_MAX_PAIRS:-20}
      HERB_ASSOCIATION_AI_MAX_INPUT_CHARS: ${HERB_ASSOCIATION_AI_MAX_INPUT_CHARS:-100000}
      HERB_ASSOCIATION_AI_MAX_PASSAGE_CHARS: ${HERB_ASSOCIATION_AI_MAX_PASSAGE_CHARS:-1000}
      HERB_ASSOCIATION_AI_CONTEXT_TOKENS: ${HERB_ASSOCIATION_AI_CONTEXT_TOKENS:-32768}
      HERB_ASSOCIATION_AI_MAX_OUTPUT_TOKENS: ${HERB_ASSOCIATION_AI_MAX_OUTPUT_TOKENS:-2048}
      HERB_ASSOCIATION_AI_TIMEOUT_SECONDS: ${HERB_ASSOCIATION_AI_TIMEOUT_SECONDS:-900}
      HERB_ASSOCIATION_AI_KEEP_ALIVE_SECONDS: ${HERB_ASSOCIATION_AI_KEEP_ALIVE_SECONDS:-3600}
      HERB_ASSOCIATION_BUILD_TIMEOUT_SECONDS: ${HERB_ASSOCIATION_BUILD_TIMEOUT_SECONDS:-7200}
      HERB_ASSOCIATION_AI_MAX_REQUESTS: ${HERB_ASSOCIATION_AI_MAX_REQUESTS:-1000}
      HERB_SAFETY_AI_MAX_REQUESTS: ${HERB_SAFETY_AI_MAX_REQUESTS:-10000}
      HERB_SAFETY_AI_CONTEXT_TOKENS: ${HERB_SAFETY_AI_CONTEXT_TOKENS:-65536}
      HERB_SAFETY_AI_MAX_OUTPUT_TOKENS: ${HERB_SAFETY_AI_MAX_OUTPUT_TOKENS:-40000}
      HERB_SAFETY_BUILD_TIMEOUT_SECONDS: ${HERB_SAFETY_BUILD_TIMEOUT_SECONDS:-86400}
      HERB_SAFETY_MINISTRAL_BATCH_SIZE: ${HERB_SAFETY_MINISTRAL_BATCH_SIZE:-10}
      HERB_SAFETY_DEEPSEEK_BATCH_SIZE: ${HERB_SAFETY_DEEPSEEK_BATCH_SIZE:-100}
      HERB_SAFETY_DEEPSEEK_MAX_OUTPUT_TOKENS: ${HERB_SAFETY_DEEPSEEK_MAX_OUTPUT_TOKENS:-160000}
      HERB_SAFETY_DEDUP_MODEL: ${HERB_SAFETY_DEDUP_MODEL:-gemma4:12b}
      HERB_SAFETY_GENERATION_MODEL: ${HERB_SAFETY_GENERATION_MODEL-ministral-3:8b}
      HERB_SAFETY_EXTENSION_PRODUCTS: ${HERB_SAFETY_EXTENSION_PRODUCTS:-}
      HERB_CONDITION_TOP_FORMULA: ${HERB_CONDITION_TOP_FORMULA:-2*L1+L2+100*L3}
      REPORT_GENERATION_AI_STREAM: ${REPORT_GENERATION_AI_STREAM:-false}
      REPORT_GENERATION_MAX_OUTPUT_TOKENS: ${REPORT_GENERATION_MAX_OUTPUT_TOKENS:-20000}
      REPORT_GENERATION_READ_TIMEOUT_SECONDS: ${REPORT_GENERATION_READ_TIMEOUT_SECONDS:-300}
      REPORT_GENERATION_TIMEOUT_SECONDS: ${REPORT_GENERATION_TIMEOUT_SECONDS:-600}
      REPORT_SHUTDOWN_TIMEOUT_SECONDS: ${REPORT_SHUTDOWN_TIMEOUT_SECONDS:-20}
      OPERATION_TIMEOUT_SECONDS: ${OPERATION_TIMEOUT_SECONDS:-600}
      SESSION_RECONNECT_GRACE_SECONDS: ${SESSION_RECONNECT_GRACE_SECONDS:-30}
      MAX_CONCURRENT_GENERATIONS: ${MAX_CONCURRENT_GENERATIONS:-1}
      MAX_QUEUED_GENERATIONS: ${MAX_QUEUED_GENERATIONS:-20}
      DOCUMENTS_DIR: /app/medicina-naturista-documente/data/documents/ro
      DOCUMENTS_EN_DIR: /app/medicina-naturista-documente/data/documents/en
      HERB_IMAGES_DIR: /app/medicina-naturista-documente/data/images
      DATABASE_URL: postgresql://${POSTGRES_USER:-medicina}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medicina}
      MODEL_CACHE_DIR: /app/model_cache
      SESSION_TEMP_DIR: /tmp/naturist-sessions
      PUBLIC_ROOT_PATH: ${PUBLIC_ROOT_PATH:-/medicina}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-3600}
      SESSION_MAX_SECONDS: ${SESSION_MAX_SECONDS:-14400}
      NEW_SESSIONS_PER_COOKIE_MINUTE: ${NEW_SESSIONS_PER_COOKIE_MINUTE:-5}
      NEW_SESSIONS_PER_IP_MINUTE: ${NEW_SESSIONS_PER_IP_MINUTE:-10}
      MAX_CHAT_CHARS: ${MAX_CHAT_CHARS:-4000}
      MAX_REQUESTS_PER_MINUTE: ${MAX_REQUESTS_PER_MINUTE:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FRAGMENT_TEXT: ${LOG_FRAGMENT_TEXT:-true}
      LOG_FRAGMENT_TEXT_MAX_CHARS: ${LOG_FRAGMENT_TEXT_MAX_CHARS:-4000}
      EMBEDDING_THREADS: ${EMBEDDING_THREADS:-8}
      LOG_AI_RESPONSE_TEXT: ${LOG_AI_RESPONSE_TEXT:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      OWNER_KEY: ${OWNER_KEY:-}
    volumes:
      - type: bind
        source: ./src/backend/resources/texts.ro.toml
        target: /app/src/backend/resources/texts.ro.toml
        read_only: true
      - type: bind
        source: ./src/backend/resources/texts.en.toml
        target: /app/src/backend/resources/texts.en.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./medicina-naturista-documente/data/documents
        target: /app/medicina-naturista-documente/data/documents
        read_only: true
      - type: bind
        source: ./model_cache
        target: /app/model_cache
      - type: bind
        source: ./medicina-naturista-documente/data/images
        target: /app/medicina-naturista-documente/data/images
        read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    # Host Ollama serves message classification, condition identification and,
    # for either Ollama report choice, report generation. Start it outside Compose.
    # Set on Windows: OLLAMA_FLASH_ATTENTION=1, OLLAMA_KV_CACHE_TYPE=q4_0,
    # OLLAMA_NUM_PARALLEL=2, OLLAMA_CONTEXT_LENGTH=262144; then restart Ollama.
    # For local concurrency, OLLAMA_NUM_PARALLEL must allow REPORT_BATCH_WORKERS requests.
    # These server settings do not take effect in the app container's environment.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Host port outside the Windows-reserved 7772-7871 range; the container stays on 7860.
      - "127.0.0.1:${APP_HOST_PORT:-8760}:7860"
    networks: [internal]
  # Local TranslateGemma server for src/scripts/translate_markdown.py --backend vllm. Not started
  # by `docker compose up`; it needs the whole GPU, so stop host Ollama models first (ollama ps)
  # and start it with: docker compose --profile vllm up -d vllm
  # The model is gated on Hugging Face: accept its license and put HF_TOKEN in .env.
  vllm:
    profiles: [vllm]
    image: vllm/vllm-openai:v0.32.0
    container_name: medicina-vllm
    restart: "no"
    ipc: host
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - vllm_hf_cache:/root/.cache/huggingface
      - type: bind
        source: ./src/scripts/resources/translategemma_ro_en.jinja
        target: /templates/translategemma.jinja
        read_only: true
    ports:
      - "127.0.0.1:${VLLM_HOST_PORT:-8000}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # FP8 weights keep the 4B model near 5 GB and the FP8 KV cache holds twice the tokens of bf16; the context and 32 sequences match the script
    # (--num-ctx 4096, --workers 32). The chat template renders the official TranslateGemma
    # prompt for a plain user message. Lower --gpu-memory-utilization if the GPU is shared.
    command:
      - --model=google/translategemma-4b-it
      - --served-model-name=translategemma
      - --quantization=fp8_per_tensor
      - --max-model-len=4096
      - --max-num-seqs=32
      - --gpu-memory-utilization=0.84
      - --kv-cache-dtype=fp8
      - --chat-template=/templates/translategemma.jinja
      - --limit-mm-per-prompt.image=0
    networks: [internal]
  # Local Qwen3.5-4B server for the report model vllm-qwen3.5:4b (Responses API at /v1/responses).
  # It shares the GPU with the `vllm` translation service above, so run only one of the two, and
  # stop host Ollama models first. Start it with: docker compose --profile vllm-report up -d vllm-report
  # The app reaches it as http://vllm-report:8000/v1 (VLLM_API_BASE); the host port 8001 is for the
  # scripts and for native runs. --max-model-len must cover the batch input plus the output limit
  # of the report (26,200 + 50,000 tokens in .env); raise it together with those limits.
  vllm-report:
    profiles: [vllm-report]
    image: vllm/vllm-openai:v0.32.0
    container_name: medicina-vllm-report
    restart: "no"
    ipc: host
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - vllm_hf_cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:${VLLM_REPORT_HOST_PORT:-8001}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # The qwen3 parser separates the thinking from the answer, and the Responses
    # `reasoning.effort` "none" (effort low in the report panel) switches thinking off.
    command:
      - --model=Qwen/Qwen3.5-4B
      - --served-model-name=qwen3.5-4b
      - --quantization=fp8_per_tensor
      - --max-model-len=81920
      - --max-num-seqs=32
      - --gpu-memory-utilization=0.84
      - --kv-cache-dtype=fp8
      - --reasoning-parser=qwen3
      - --language-model-only
    networks: [internal]
networks:
  internal:
volumes:
  pg_data:
  vllm_hf_cache:
    name: vllm_hf_cache
