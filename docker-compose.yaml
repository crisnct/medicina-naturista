services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    container_name: medicina-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medicina}
      POSTGRES_USER: ${POSTGRES_USER:-medicina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medicina} -d ${POSTGRES_DB:-medicina}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    networks: [internal]
  app:
    build: .
    restart: unless-stopped
    container_name: medicina
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    depends_on:
      db:
        condition: service_healthy
    environment:
      GROK_API_KEY_MED: ${GROK_API_KEY_MED:?GROK_API_KEY_MED must be set in .env}
      MAIL_FROM: ${MAIL_FROM:-}
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4.3}
      XAI_REASONING_EFFORT: ${XAI_REASONING_EFFORT:-low}
      XAI_API_BASE: ${XAI_API_BASE:-https://api.x.ai/v1}
      DOCUMENTS_DIR: /app/data/documents
      DATABASE_URL: postgresql://${POSTGRES_USER:-medicina}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medicina}
      MODEL_CACHE_DIR: /app/data/model_cache
      SESSION_TEMP_DIR: /tmp/naturist-sessions
      GRADIO_TEMP_DIR: /tmp/gradio-cache
      GRADIO_ROOT_PATH: ${GRADIO_ROOT_PATH:-/medicina}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-3600}
      SESSION_MAX_SECONDS: ${SESSION_MAX_SECONDS:-14400}
      MAX_CHAT_CHARS: ${MAX_CHAT_CHARS:-4000}
      MAX_REQUESTS_PER_MINUTE: ${MAX_REQUESTS_PER_MINUTE:-60}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-2400000}
      MERGE_MAX_PERCENT_DIFF: ${MERGE_MAX_PERCENT_DIFF:-9}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FRAGMENT_TEXT: ${LOG_FRAGMENT_TEXT:-true}
      LOG_FRAGMENT_TEXT_MAX_CHARS: ${LOG_FRAGMENT_TEXT_MAX_CHARS:-4000}
      LOG_AI_RESPONSE_TEXT: ${LOG_AI_RESPONSE_TEXT:-false}
      LOG_AI_RESPONSE_TEXT_MAX_CHARS: ${LOG_AI_RESPONSE_TEXT_MAX_CHARS:-8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: "true"
      OWNER_KEY: ${OWNER_KEY:-}
    volumes:
      - type: bind
        source: ./data/documents
        target: /app/data/documents
        read_only: true
      - type: bind
        source: ./data/model_cache
        target: /app/data/model_cache
    tmpfs:
      - /tmp:size=536870912,mode=1777
    ports:
      - "127.0.0.1:7860:7860"
    networks: [internal]
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      CADDY_SITE_SCHEME: ${CADDY_SITE_SCHEME:-http}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
networks:
  internal:
volumes:
  caddy_data:
  caddy_config:
  pg_data:
