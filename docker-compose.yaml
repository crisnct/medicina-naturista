services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    container_name: medicina-db
    # The chunks table (~150 MB) must fit in shared_buffers (default 128 MB), or
    # the first search after a restart reads it from disk and takes ~0.5 s.
    command: ["postgres", "-c", "shared_buffers=512MB"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medicina}
      POSTGRES_USER: ${POSTGRES_USER:-medicina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medicina} -d ${POSTGRES_DB:-medicina}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    networks: [internal]
  app:
    build:
      context: .
      args:
        PUBLIC_BASE_PATH: ${PUBLIC_ROOT_PATH:-/medicina}
    restart: unless-stopped
    container_name: medicina
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    depends_on:
      db:
        condition: service_healthy
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-xai}
      X_API_KEY: ${X_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4.3}
      XAI_REASONING_EFFORT: ${XAI_REASONING_EFFORT:-low}
      X_AI_MAX_CONTEXT_CHARS: ${X_AI_MAX_CONTEXT_CHARS:-1000000}
      XAI_API_BASE: ${XAI_API_BASE:-https://api.x.ai/v1}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-deepseek-ai/DeepSeek-V4-Flash:deepinfra}
      HF_API_BASE: ${HF_API_BASE:-https://router.huggingface.co/v1}
      HF_REASONING_EFFORT: ${HF_REASONING_EFFORT:-}
      HF_MAX_CONTEXT_CHARS: ${HF_MAX_CONTEXT_CHARS:-120000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      DEEPSEEK_REASONING_EFFORT: ${DEEPSEEK_REASONING_EFFORT:-}
      DEEPSEEK_MAX_CONTEXT_CHARS: ${DEEPSEEK_MAX_CONTEXT_CHARS:-1000000}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-v4.1-flash:cloud}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_REASONING_EFFORT: ${OLLAMA_REASONING_EFFORT:-}
      OLLAMA_MAX_CONTEXT_CHARS: ${OLLAMA_MAX_CONTEXT_CHARS:-1000000}
      AI_STREAM: ${AI_STREAM:-false}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-20000}
      AI_READ_TIMEOUT_SECONDS: ${AI_READ_TIMEOUT_SECONDS:-300}
      DOCUMENTS_DIR: /app/data/documents
      DATABASE_URL: postgresql://${POSTGRES_USER:-medicina}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medicina}
      MODEL_CACHE_DIR: /app/data/model_cache
      SESSION_TEMP_DIR: /tmp/naturist-sessions
      PUBLIC_ROOT_PATH: ${PUBLIC_ROOT_PATH:-/medicina}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-3600}
      SESSION_MAX_SECONDS: ${SESSION_MAX_SECONDS:-14400}
      MAX_CHAT_CHARS: ${MAX_CHAT_CHARS:-4000}
      MAX_REQUESTS_PER_MINUTE: ${MAX_REQUESTS_PER_MINUTE:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FRAGMENT_TEXT: ${LOG_FRAGMENT_TEXT:-true}
      LOG_FRAGMENT_TEXT_MAX_CHARS: ${LOG_FRAGMENT_TEXT_MAX_CHARS:-4000}
      LOG_AI_RESPONSE_TEXT: ${LOG_AI_RESPONSE_TEXT:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: "true"
      OWNER_KEY: ${OWNER_KEY:-}
    volumes:
      - type: bind
        source: ./data/documents
        target: /app/data/documents
        read_only: true
      - type: bind
        source: ./data/model_cache
        target: /app/data/model_cache
    tmpfs:
      - /tmp:size=536870912,mode=1777
    # Reaches an Ollama daemon running on the host (AI_PROVIDER=ollama).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Host port outside the Windows-reserved 7772-7871 range; the container stays on 7860.
      - "127.0.0.1:${APP_HOST_PORT:-8760}:7860"
    networks: [internal]
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      CADDY_SITE_SCHEME: ${CADDY_SITE_SCHEME:-http}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
networks:
  internal:
volumes:
  caddy_data:
  caddy_config:
  pg_data:
