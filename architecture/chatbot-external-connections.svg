<svg xmlns="http://www.w3.org/2000/svg" width="680" height="820" viewBox="0 0 680 820" role="img">
<title>medicina-naturista chatbot architecture and its connections to external systems</title>
<desc>The browser goes through Caddy to the FastAPI app. Internal flow: chat, condition dictionary, AI condition identification (local Ollama gemma3:1b, then DeepSeek via Hugging Face), hybrid search in PostgreSQL with pgvector, recipe generation through the AI_PROVIDER LLM, then PDF and email via the Gmail API. Offline, the indexing script reads the source documents and the Qwen3 model from the Hugging Face Hub and writes to PostgreSQL.</desc>
<style>
text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; }
.lbl { font-size: 12px; fill: #5F5E5A; }
.gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
.gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
.purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
.purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
.teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
.teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
.arr { stroke: #888780; stroke-width: 1.5; fill: none; }
.dash { stroke-dasharray: 4 3; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

