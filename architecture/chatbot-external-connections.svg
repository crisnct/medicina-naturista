<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1420" viewBox="0 0 1280 1420" role="img" aria-labelledby="title description">
<title id="title">Chatbot medicina-naturista — conexiuni conform implementării</title>
<desc id="description">React comunică cu FastAPI direct în dezvoltare sau prin Caddy în Compose; tunelul și proxy-ul JobsHunter sunt opționale și externe stivei. Dicționarul local medical_conditions.jsonl rezolvă afecțiunile. Identificarea AI opțională folosește implicit Ollama gemma3:1b, apoi Hugging Face numai la eșecul backendului anterior. Căutarea locală combină semnalele A, B și C în PostgreSQL cu pgvector și FTS; întrebările sunt încorporate pe CPU cu Qwen3 din cache, offline. Generarea raportului este separată, autorizată pentru proprietar și folosește AI_PROVIDER. Raportul validat produce PDF local. Emailul cerut ulterior folosește Google OAuth2 și Gmail API. Scriptul de sincronizare citește Markdown și dicționarul JSONL, descarcă modelul în cache la pregătire și publică indexul într-o tranzacție PostgreSQL. Indexarea acceptă CPU sau CUDA.</desc>
<style>
text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
.title { font-size: 23px; font-weight: 650; fill: #343431; }
.th { font-size: 17px; font-weight: 600; }
.ts { font-size: 14px; }
.code { font-family: Consolas, "Liberation Mono", monospace; font-size: 13px; }
.lbl { font-size: 13px; fill: #5F5E5A; }
.section { font-size: 15px; font-weight: 600; fill: #5F5E5A; }
.gray rect { fill: #F1EFE8; stroke: #888780; stroke-width: 1; }
.gray text { fill: #444441; }
.purple rect { fill: #EEEDFE; stroke: #7971BB; stroke-width: 1; }
.purple text { fill: #3C3489; }
.teal rect { fill: #E1F5EE; stroke: #4D9A83; stroke-width: 1; }
.teal text { fill: #085041; }
.arr { stroke: #888780; stroke-width: 1.5; fill: none; }
.dash { stroke-dasharray: 5 4; }
.boundary { fill: #FCFCFA; stroke: #B4B2A9; stroke-width: 1; stroke-dasharray: 6 5; }
</style>
