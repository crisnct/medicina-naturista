<g class="gray"><rect x="220" y="110" width="220" height="44" rx="4"/><text class="th" x="330" y="137" text-anchor="middle">Caddy · HTTPS proxy</text></g>
<line x1="330" y1="154" x2="330" y2="208" class="arr" marker-end="url(#arrow)"/>

<rect x="205" y="180" width="250" height="476" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="lbl" x="215" y="646">container app · FastAPI :7860</text>

<text class="lbl" x="40" y="346">Internal Docker network</text>
<text class="lbl" x="475" y="346">External cloud · HTTPS</text>

<g class="gray"><rect x="220" y="210" width="220" height="52" rx="4"/><text class="th" x="330" y="231" text-anchor="middle">Chat API</text><text class="ts" x="330" y="249" text-anchor="middle">POST /api/messages</text></g>
