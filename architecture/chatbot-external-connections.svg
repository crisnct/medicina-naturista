<g class="purple"><rect x="475" y="494" width="165" height="72" rx="4"/><text class="th" x="557" y="516" text-anchor="middle">LLM (AI_PROVIDER)</text><text class="ts" x="557" y="536" text-anchor="middle">active: DeepSeek API</text><text class="ts" x="557" y="553" text-anchor="middle">alt: xAI / HF / Ollama</text></g>
<line x1="440" y1="532" x2="473" y2="532" class="arr" marker-end="url(#arrow)"/>
<g class="gray"><rect x="475" y="580" width="165" height="52" rx="4"/><text class="th" x="557" y="601" text-anchor="middle">Google Gmail API</text><text class="ts" x="557" y="619" text-anchor="middle">OAuth2 · sends PDF</text></g>
<line x1="440" y1="606" x2="473" y2="606" class="arr" marker-end="url(#arrow)"/>

<g class="gray"><rect x="40" y="700" width="145" height="52" rx="4"/><text class="th" x="112" y="721" text-anchor="middle">Offline indexing</text><text class="ts" x="112" y="739" text-anchor="middle">build_hybrid_index</text></g>
<g class="teal"><rect x="220" y="700" width="220" height="52" rx="4"/><text class="th" x="330" y="721" text-anchor="middle">Source documents</text><text class="ts" x="330" y="739" text-anchor="middle">data/documents (Markdown)</text></g>
