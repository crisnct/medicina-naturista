<g class="gray"><rect x="220" y="284" width="220" height="52" rx="4"/><text class="th" x="330" y="305" text-anchor="middle">Condition dictionary</text><text class="ts" x="330" y="323" text-anchor="middle">medical_conditions.txt</text></g>
<line x1="330" y1="336" x2="330" y2="356" class="arr" marker-end="url(#arrow)"/>
<g class="gray"><rect x="220" y="358" width="220" height="52" rx="4"/><text class="th" x="330" y="379" text-anchor="middle">AI condition identification</text><text class="ts" x="330" y="397" text-anchor="middle">only if not in dictionary</text></g>
