name: Verify application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev-py311-linux.lock
      - run: python -m pip install --require-hashes -r requirements-dev-py311-linux.lock
      - run: python -m scripts.manage_dependencies --check
        env:
          PYTHONPATH: src
      - run: python -m ruff check src
      - run: python -m ruff format --check src
      - run: python -m mypy
      - run: python -m mypy src/backend/ai/herbs.py src/backend/ai/herb_repository.py src/backend/ai/herb_validation.py src/scripts/convert_herbs_to_sql.py
      - run: python -m mypy --explicit-package-bases src/scripts/build_hybrid_index.py src/scripts/migrate_database.py src/backend/ai/index_state.py

  unit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      HF_HUB_OFFLINE: '1'
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev-py311-linux.lock
      - run: python -m pip install --require-hashes -r requirements-dev-py311-linux.lock
      - run: python -m pip check
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation2
      - run: python -m unittest discover -s src/tests/unit -t src -v
      # Existing function-style tests are collected by pytest, not unittest.
      - run: python -m pytest src/tests/unit/ai/test_report_validation.py src/tests/unit/web/test_report_integrity.py -q
      - name: Synthetic content metrics (no personal corpus or real AI)
        run: python -m scripts.evaluate_retrieval --content --rankings src/tests/eval/synthetic_rankings.json --baseline src/tests/eval/synthetic_baseline.json --output content-metrics.json

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: synthetic-password
          POSTGRES_DB: test_index
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_index"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: src
      HF_HUB_OFFLINE: '1'
      TEST_POSTGRES_URL: postgresql://test_user:synthetic-password@127.0.0.1:5432/test_index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev-py311-linux.lock
      - run: python -m pip install --require-hashes -r requirements-dev-py311-linux.lock
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation2
      - run: python -m unittest discover -s src/tests/integration -t src -v
      - run: python -m pytest src/tests/integration/test_index_integrity.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Both catalogues ship in SQL; documents and model cache are operator-owned.
      - run: docker build --tag medicina-ci --build-arg PUBLIC_BASE_PATH=/medicina .
